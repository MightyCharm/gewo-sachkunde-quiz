<!doctype html>
<html>
  <head>
    <title>§34a GewO Tester</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <h1>
        <span class="header-span-icon"
          ><i class="fa-solid fa-shield-dog"></i
        ></span>
        <span class="header-span-text"
          ><span class="header-span-paragraph-sign">§</span>34a GewO - Test Your
          Knowledge</span
        >
      </h1>
    </header>
    <main id="main">
      <div id="container-start" class="container-start-screen">
        <button id="btn-start" class="btn-start">START</button>
      </div>
      <div id="container-end" class="container-end-screen hidden">
        <button id="btn-main-menu" class="btn-main">Menu</button>
      </div>
      <div class="container-game-content">
        <div class="container-game-control hidden">
          <button id="btn-quit" class="btn-quit">QUIT</button>
        </div>

        <div class="container-stats hidden">
          <p class="para-stats">
            <span class="stats-description">Gesamt:</span>
            <span id="stat-total-current" class="stats-value"></span>/
            <span id="stat-total-max" class="stats-value"></span>
          </p>
          <p class="para-stats">
            <span class="stats-description">Gewusst:</span
            ><span id="stat-correct" class="stats-value"></span>
          </p>
          <p class="para-stats">
            <span class="stats-description">Nicht Gewusst:</span
            ><span id="stat-wrong" class="stats-value"></span>
          </p>
        </div>

        <div class="container-question hidden">
          <h2
            class="question-header-category"
            id="header-question-category"
          ></h2>
          <p id="para-question" class="question-para"></p>
          <p id="id-question" class="question-id"></p>
        </div>

        <div class="container-answer hidden"></div>

        <div class="container-show-answer hidden">
          <button id="btn-show-answer" class="btn-show-answer">
            Zeige Antwort
          </button>
        </div>

        <div class="container-check hidden">
          <button id="btn-correct" class="btn-correct">Gewusst</button>
          <button id="btn-wrong" class="btn-wrong">Nicht gewusst</button>
        </div>
      </div>
    </main>
    <footer>
      <ul>
        <li>
          <span class="footer-span-icon"><i class="fa-solid fa-book"></i></span
          ><span
            >Flashcard trainer for the German security guard certification
            exam</span
          >
        </li>
        <li>
          <span class="footer-span-icon"
            ><i class="fa-solid fa-laptop-code"></i></span
          ><span>Built by Michael @2026 Sololearn</span>
        </li>
      </ul>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
